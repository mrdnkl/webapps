<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBAPSS TV</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/shaka-player/dist/controls.min.css">
    <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Material+Icons+Sharp">
    <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Material+Icons+Round">
    <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141b2d;
            --bg-tertiary: #1a2332;
            --bg-card: #1e2738;
            --text-primary: #e8eaf0;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-secondary: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --gradient-overlay: linear-gradient(180deg, rgba(10, 14, 26, 0) 0%, rgba(10, 14, 26, 0.95) 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 70%);
            animation: gradientShift 20s ease infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 5%) rotate(90deg); }
            50% { transform: translate(0, 10%) rotate(180deg); }
            75% { transform: translate(-5%, 5%) rotate(270deg); }
        }

        /* Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .header {
            margin-bottom: 32px;
            animation: fadeInDown 0.6s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 32px;
            animation: fadeInDown 0.6s ease 0.1s both;
        }

        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 56px 16px 24px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-button:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .search-button:active {
            transform: translateY(-50%) scale(0.98);
        }

        /* Channel Grid */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        .channel-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .channel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .channel-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: var(--shadow-lg), 0 0 24px rgba(59, 130, 246, 0.2);
        }

        .channel-card:hover::before {
            transform: scaleX(1);
        }

        .channel-logo-wrapper {
            width: 100%;
            height: 140px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            overflow: hidden;
            position: relative;
        }

        .channel-logo-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-overlay);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .channel-card:hover .channel-logo-wrapper::after {
            opacity: 0.3;
        }

        .channel-logo {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .channel-logo-placeholder {
            font-size: 3rem;
            color: var(--text-secondary);
        }

        .channel-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .channel-group {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-group-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--accent-blue);
        }

        .drm-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 6px;
            font-size: 0.7rem;
            color: var(--accent-purple);
            margin-top: 8px;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-results h3 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* Video Player */
        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }

        .player-container.active {
            display: flex;
            flex-direction: column;
        }

        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-button {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .back-button:active {
            transform: scale(0.95);
        }

        .player-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
        }

        #video-container {
            width: 100%;
            height: 100%;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            background: #000;
        }

        video::-webkit-media-controls {
            display: none !important;
        }
        
        video::-webkit-media-controls-enclosure {
            display: none !important;
        }
        
        video::-webkit-media-controls-panel {
            display: none !important;
        }
        
        video::-webkit-media-controls-play-button {
            display: none !important;
        }
        
        video::-webkit-media-controls-timeline {
            display: none !important;
        }
        
        video::-webkit-media-controls-current-time-display {
            display: none !important;
        }
        
        video::-webkit-media-controls-time-remaining-display {
            display: none !important;
        }
        
        video::-webkit-media-controls-mute-button {
            display: none !important;
        }
        
        video::-webkit-media-controls-volume-slider {
            display: none !important;
        }
        
        video::-webkit-media-controls-fullscreen-button {
            display: none !important;
        }
        
        video::-moz-media-controls {
            display: none !important;
        }
        
        #video {
            pointer-events: auto;
        }

        .shaka-current-time {
            display: none !important;
        }
        
        .shaka-time-and-duration {
            display: none !important;
        }
        
        .shaka-ad-position,
        .shaka-ad-counter {
            display: none !important;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .channel-card {
                padding: 16px;
            }

            .channel-logo-wrapper {
                height: 100px;
            }

            .channel-name {
                font-size: 1rem;
            }
            
            #video {
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
            }
            
            video {
                object-fit: contain;
            }
        }

        @media (max-width: 480px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .error-state h3 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .retry-button {
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .retry-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="container" id="main-container">
        <!-- Header -->
        <div class="header">
            <h1>📡 WEBAPPS TV</h1>
            <p>Browse and watch your favorite channels</p>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    class="search-input" 
                    id="search-input" 
                    placeholder="Search channels..."
                    autocomplete="off"
                >
                <button class="search-button" id="search-button">
                    <span class="material-icons-round">search</span>
                </button>
            </div>
        </div>

        <!-- Channels Grid -->
        <div class="channels-grid" id="channels-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p style="color: var(--text-secondary);">Loading channels...</p>
            </div>
        </div>
    </div>

    <!-- Video Player -->
    <div class="player-container" id="player-container">
        <div class="player-header">
            <button class="back-button" id="back-button">
                <span class="material-icons-round">arrow_back</span>
            </button>
            <div class="player-title" id="player-title">Channel Name</div>
        </div>
        <div id="video-container" data-shaka-player-container>
            <video 
                id="video" 
                data-shaka-player 
                autoplay
                playsinline
                preload="metadata"
            ></video>
        </div>
    </div>

    <script>
        // ============================================
        // IPTV PLAYER - ADVANCED DRM SUPPORT
        // ============================================

        /**
         * Configuration Constants
         */
        const CONFIG = {
            M3U_URL: "https://raw.githubusercontent.com/ottlat/ottlat.github.io/refs/heads/main/mpd.m3u",
            SEARCH_DEBOUNCE_MS: 300,
            PLAYER_CONFIG: {
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 15,
                    rebufferingGoal: 2,
                    bufferBehind: 15,
                    retryParameters: { 
                        timeout: 10000, 
                        maxAttempts: 5, 
                        baseDelay: 300, 
                        backoffFactor: 1.2 
                    },
                    segmentRequestTimeout: 8000,
                    segmentPrefetchLimit: 2,
                    useNativeHlsOnSafari: true
                },
                manifest: { 
                    retryParameters: { 
                        timeout: 8000, 
                        maxAttempts: 3 
                    } 
                }
            },
            UI_CONFIG: {
                'controlPanelElements': [
                    'play_pause',
                    'time_and_duration',
                    'spacer',
                    'mute',
                    'volume',
                    'fullscreen',
                    'overflow_menu'
                ],
                'overflowMenuButtons': [
                    'captions',
                    'quality',
                    'language',
                    'picture_in_picture',
                    'playback_rate'
                ],
                'volumeBarColors': {
                    'base': 'rgba(63, 187, 1, 1)',
                    'level': 'rgb(255, 69, 0)'
                },
                'seekBarColors': {
                    'base': 'rgb(41, 41, 163)',
                    'buffered': 'rgb(35, 99, 3)',
                    'played': 'rgba(63, 187, 1, 1)'
                }
            },
            DEFAULT_USER_AGENT: "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6",
            DEFAULT_REFERER: "https://www.jiotv.com/"
        };

        /**
         * Logger Utility
         */
        const Logger = {
            log: (msg, ...args) => console.log(`[IPTV] ${msg}`, ...args),
            warn: (msg, ...args) => console.warn(`[IPTV] ⚠️ ${msg}`, ...args),
            error: (msg, ...args) => console.error(`[IPTV] ❌ ${msg}`, ...args),
            success: (msg, ...args) => console.log(`[IPTV] ✅ ${msg}`, ...args),
            debug: (msg, ...args) => console.debug(`[IPTV] 🔍 ${msg}`, ...args)
        };

        /**
         * Utility Functions
         */
        const Utils = {
            debounce: (func, delay) => {
                let timeoutId;
                return (...args) => {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => func(...args), delay);
                };
            },

            getElement: (id) => {
                const element = document.getElementById(id);
                if (!element) {
                    Logger.error(`Element with ID '${id}' not found`);
                }
                return element;
            },

            isValidUrl: (url) => {
                try {
                    new URL(url);
                    return true;
                } catch {
                    return false;
                }
            },

            /**
             * Check if string is JSON
             */
            isJSON: (str) => {
                try {
                    JSON.parse(str);
                    return true;
                } catch {
                    return false;
                }
            },

            /**
             * Safe JSON parse with fallback
             */
            parseJSON: (str, fallback = null) => {
                try {
                    return JSON.parse(str);
                } catch (error) {
                    Logger.warn(`Failed to parse JSON: ${error.message}`);
                    return fallback;
                }
            }
        };
        
  /**
 * DRM Service - Configured specifically to resolve Shaka Error 6012
 */
const DRMService = {
    /**
     * Detect DRM type from channel data
     * Returns: 'widevine' | 'clearkey' | 'none'
     */
    detectDRMType: (channel) => {
        if (channel.widevineLicenseUrl) {
            return 'widevine';
        }

        if (channel.clearkey || channel.licenseKey) {
            return 'clearkey';
        }

        return 'none';
    },

    /**
     * Get Widevine configuration object structured for Shaka Player
     */
    getWidevineLicenseConfig: (channel) => {
        if (!channel.widevineLicenseUrl) return null;

        // Proper structure nesting 'servers' inside 'drm' to prevent Error 6012
        return {
            drm: {
                servers: {
                    'com.widevine.alpha': channel.widevineLicenseUrl
                }
            }
        };
    },

    /**
     * Configure DRM for Shaka Player instance
     */
    configureDRM: (player, channel) => {
        const drmType = DRMService.detectDRMType(channel);
        
        if (drmType === 'none') {
            Logger.log('No DRM protection detected for this channel');
            return;
        }

        Logger.log(`Configuring ${drmType.toUpperCase()} DRM`);

        try {
            if (drmType === 'widevine') {
                DRMService._configureWidevine(player, channel);
            } else if (drmType === 'clearkey') {
                DRMService._configureClearkey(player, channel);
            }
        } catch (error) {
            Logger.error(`Failed to configure ${drmType} DRM: ${error.message}`);
            throw error;
        }
    },

    /**
     * Configure Widevine DRM
     */
    _configureWidevine: (player, channel) => {
        const config = DRMService.getWidevineLicenseConfig(channel);
        
        if (!config) {
            throw new Error('Widevine license URL missing');
        }

        // Apply configuration to player instance
        player.configure(config);
        Logger.success('Widevine DRM configured correctly');
    },

    /**
     * Configure ClearKey DRM
     */
    _configureClearkey: (player, channel) => {
        const clearKeyData = channel.clearkey || channel.licenseKey;
        
        if (!clearKeyData) {
            throw new Error('ClearKey data not available');
        }

        const parsedLicense = DRMService.parseClearKeyLicense(clearKeyData);
        
        if (!parsedLicense || !parsedLicense.keys) {
            throw new Error('Invalid ClearKey license format');
        }

        player.configure({
            drm: {
                clearKeys: parsedLicense.keys
            }
        });
        Logger.success('ClearKey DRM configured');
    },

    /**
     * Helper to parse ClearKey formats
     */
    parseClearKeyLicense: (licenseData) => {
        if (!licenseData) return null;

        if (Utils.isJSON(licenseData)) {
            try {
                const jwk = Utils.parseJSON(licenseData);
                if (jwk.keys && Array.isArray(jwk.keys) && jwk.keys.length > 0) {
                    return {
                        format: 'jwk',
                        keys: jwk.keys.reduce((acc, key) => {
                            acc[key.kid] = key.k;
                            return acc;
                        }, {})
                    };
                }
            } catch (error) {
                Logger.warn(`Failed to parse JWK: ${error.message}`);
            }
        }

        if (typeof licenseData === 'string' && licenseData.includes(':')) {
            const [kid, key] = licenseData.split(':');
            if (kid && key) {
                return {
                    format: 'simple',
                    keys: { [kid]: key }
                };
            }
        }

        return null;
    }
};      
        
        /**
 * Updated M3U Parser Service with Comprehensive Widevine DRM Support
 */
const M3UParser = {
    fetch: async (url) => {
        if (!Utils.isValidUrl(url)) {
            throw new Error(`Invalid M3U URL: ${url}`);
        }

        Logger.log(`Fetching M3U from: ${url}`);
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            const text = await response.text();
            Logger.log(`M3U fetched successfully. Size: ${text.length} bytes`);
            return text;
        } catch (error) {
            Logger.error(`Failed to fetch M3U: ${error.message}`);
            throw error;
        }
    },

    parse: (m3uContent) => {
        if (!m3uContent || typeof m3uContent !== 'string') {
            Logger.error('Invalid M3U content provided');
            return [];
        }

        const channels = [];
        const lines = m3uContent
            .split('\n')
            .map(line => line.trim())
            .filter(line => line);

        let currentChannel = {};
        let licenseKey = '';
        let clearkey = '';
        let widevineLicenseUrl = '';
        let licenseHeaders = {};
        let cookie = '';
        let drmTypeDetected = '';

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];

            // 1. Parse EXTINF line (channel metadata)
            if (line.startsWith('#EXTINF:')) {
                currentChannel = M3UParser._parseExtinf(line);
            }
            // 2. Parse License Type (e.g., com.widevine.alpha)
            else if (line.startsWith('#KODIPROP:inputstream.adaptive.license_type=')) {
                drmTypeDetected = line.replace('#KODIPROP:inputstream.adaptive.license_type=', '').trim();
            }
            // 3. Parse Widevine license URL from generic inputstream.adaptive or explicit widevine key tag
            else if (
                line.startsWith('#KODIPROP:inputstream.adaptive.license_key=') ||
                line.startsWith('#KODIPROP:inputstream.widevine.license_key=')
            ) {
                const extractedKey = line
                    .replace('#KODIPROP:inputstream.adaptive.license_key=', '')
                    .replace('#KODIPROP:inputstream.widevine.license_key=', '')
                    .trim();

                // If license_type was defined as com.widevine.alpha, or if it's an HTTP URL, assign to Widevine
                if (drmTypeDetected === 'com.widevine.alpha' || extractedKey.startsWith('http')) {
                    widevineLicenseUrl = extractedKey;
                } else {
                    licenseKey = extractedKey; // Fallback for key:kid formats
                }
            }
            // 4. Parse ClearKey license (JSON JWK or kid:key format)
            else if (
                line.startsWith('#KODIPROP:inputstream.clearkey.license_key=') || 
                line.startsWith('#EXT-X-CLEARKEY=')
            ) {
                clearkey = line
                    .replace('#KODIPROP:inputstream.clearkey.license_key=', '')
                    .replace('#EXT-X-CLEARKEY=', '')
                    .trim();
            }
            // 5. Parse custom license headers
            else if (line.startsWith('#KODIPROP:inputstream.adaptive.license_headers=')) {
                const headerStr = line.replace('#KODIPROP:inputstream.adaptive.license_headers=', '');
                licenseHeaders = Utils.parseJSON(headerStr, {});
            }
            // 6. Parse cookies
            else if (line.startsWith('#EXTHTTP:')) {
                const cookieMatch = line.match(/"cookie":"([^"]+)"/);
                if (cookieMatch) {
                    cookie = cookieMatch[1];
                }
            }
            // 7. Parse stream URL & finalize channel object
            else if (line.startsWith('http')) {
                const channel = M3UParser._parseStreamUrl(
                    line, 
                    currentChannel, 
                    licenseKey,
                    clearkey,
                    widevineLicenseUrl,
                    licenseHeaders,
                    cookie
                );
                if (channel) {
                    channels.push(channel);
                }
                
                // Reset state for the next entry
                currentChannel = {};
                licenseKey = '';
                clearkey = '';
                widevineLicenseUrl = '';
                licenseHeaders = {};
                cookie = '';
                drmTypeDetected = '';
            }
        }

        Logger.success(`Parsed ${channels.length} channels`);
        return channels;
    },

    _parseExtinf: (line) => {
        const nameMatch = line.match(/,(.+)$/);
        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
        const groupMatch = line.match(/group-title="([^"]+)"/);
        const idMatch = line.match(/tvg-id="([^"]+)"/);

        return {
            name: nameMatch ? nameMatch[1].trim() : 'Unknown Channel',
            logo: logoMatch ? logoMatch[1] : '',
            group: groupMatch ? groupMatch[1] : 'General',
            id: idMatch ? idMatch[1] : `channel_${Date.now()}`
        };
    },

    _parseStreamUrl: (streamUrl, currentChannel, licenseKey, clearkey, widevineLicenseUrl, licenseHeaders, cookie) => {
        try {
            const urlCookieMatch = streamUrl.match(/__hdnea__=([^&]+)/);
            let finalCookie = cookie;
            if (urlCookieMatch && !cookie) {
                finalCookie = '__hdnea__=' + urlCookieMatch[1];
            }

            const urlParts = streamUrl.split('?');
            let cleanUrl = urlParts[0];
            
            if (urlParts.length > 1) {
                const params = urlParts[1].split('&');
                const cleanParams = params.filter(p => !p.includes('xxx='));
                if (cleanParams.length > 0) {
                    cleanUrl += '?' + cleanParams.join('&');
                }
            }

            return {
                ...currentChannel,
                streamUrl: cleanUrl,
                cookie: finalCookie,
                licenseKey: licenseKey,
                clearkey: clearkey,
                widevineLicenseUrl: widevineLicenseUrl,
                licenseHeaders: licenseHeaders
            };
        } catch (error) {
            Logger.warn(`Failed to parse stream URL: ${error.message}`);
            return null;
        }
    }
};

        /**
         * UI Service - Handles DOM manipulation
         */
        const UIService = {
            showLoading: () => {
                const grid = Utils.getElement('channels-grid');
                if (grid) {
                    grid.innerHTML = `
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p style="color: var(--text-secondary);">Loading channels...</p>
                        </div>
                    `;
                }
            },

            showError: (message = 'Could not fetch the M3U playlist. Please check your connection.') => {
                const grid = Utils.getElement('channels-grid');
                if (grid) {
                    grid.innerHTML = `
                        <div class="error-state">
                            <div class="error-icon">⚠️</div>
                            <h3>Failed to load channels</h3>
                            <p>${message}</p>
                            <button class="retry-button" onclick="IPTVApp.init()">Retry</button>
                        </div>
                    `;
                }
            },

            showNoResults: () => {
                const grid = Utils.getElement('channels-grid');
                if (grid) {
                    grid.innerHTML = `
                        <div class="no-results">
                            <div class="no-results-icon">🔍</div>
                            <h3>No channels found</h3>
                            <p>Try a different search term</p>
                        </div>
                    `;
                }
            },

            renderChannels: (channels) => {
                const grid = Utils.getElement('channels-grid');
                if (!grid) return;

                if (channels.length === 0) {
                    UIService.showNoResults();
                    return;
                }

                grid.innerHTML = channels
                    .map((channel, index) => UIService._createChannelCard(channel, index))
                    .join('');
            },

            _createChannelCard: (channel, index) => {
                const drmType = DRMService.detectDRMType(channel);
                const drmBadge = drmType !== 'none' 
                    ? `<div class="drm-badge">🔐 ${drmType.toUpperCase()}</div>` 
                    : '';

                const logoHTML = channel.logo 
                    ? `<img src="${channel.logo}" alt="${channel.name}" class="channel-logo" onerror="this.style.display='none'; this.nextElementSibling?.style.display='block';">
                       <span class="channel-logo-placeholder material-icons-round" style="display: none;">tv</span>`
                    : `<span class="channel-logo-placeholder material-icons-round">tv</span>`;

                return `
                    <div class="channel-card" data-channel-index="${index}" style="animation-delay: ${index * 0.05}s">
                        <div class="channel-logo-wrapper">
                            ${logoHTML}
                        </div>
                        <div class="channel-name">${UIService._escapeHtml(channel.name)}</div>
                        <div class="channel-group">
                            <span class="channel-group-badge">
                                <span class="material-icons-round" style="font-size: 0.875rem;">folder</span>
                                ${UIService._escapeHtml(channel.group)}
                            </span>
                        </div>
                        ${drmBadge}
                    </div>
                `;
            },

            _escapeHtml: (text) => {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            },

            showPlayer: (channelName) => {
                const playerContainer = Utils.getElement('player-container');
                const playerTitle = Utils.getElement('player-title');
                
                if (playerContainer && playerTitle) {
                    playerContainer.classList.add('active');
                    playerTitle.textContent = UIService._escapeHtml(channelName);
                }
            },

            hidePlayer: () => {
                const playerContainer = Utils.getElement('player-container');
                if (playerContainer) {
                    playerContainer.classList.remove('active');
                }
            }
        };

        /**
         * Player Service - Manages Shaka Player lifecycle
         */
        const PlayerService = {
            player: null,
            ui: null,

            init: async (channel) => {
                const video = Utils.getElement('video');
                const videoContainer = Utils.getElement('video-container');

                if (!video || !videoContainer) {
                    Logger.error('Video elements not found in DOM');
                    throw new Error('Video elements not found');
                }

                Logger.log('Initializing Shaka Player...');

                try {
                    await PlayerService.destroy();

                    if (!shaka.Player.isBrowserSupported()) {
                        throw new Error('Browser not supported by Shaka Player');
                    }

                    PlayerService.player = new shaka.Player();
                    await PlayerService.player.attach(video);
                    Logger.success('Player attached to video element');

                    PlayerService.ui = new shaka.ui.Overlay(PlayerService.player, videoContainer, video);
                    Logger.success('UI Overlay created');

                    PlayerService.ui.configure(CONFIG.UI_CONFIG);
                    Logger.success('UI configured');

                    PlayerService.player.addEventListener('error', PlayerService._handleError);

                    PlayerService.player.configure(CONFIG.PLAYER_CONFIG);
                    Logger.success('Player configuration set');

                    // Configure DRM BEFORE networking
                    DRMService.configureDRM(PlayerService.player, channel);

                    PlayerService._configureNetworking(channel);

                    Logger.log('Loading stream...');
                    await PlayerService.player.load(channel.streamUrl);
                    Logger.success('Stream loaded successfully!');
                } catch (error) {
                    Logger.error(`Player initialization failed: ${error.message}`);
                    throw error;
                }
            },


            _configureNetworking: (channel) => {
    if (!PlayerService.player) return;

    const netEngine = PlayerService.player.getNetworkingEngine();

    // Request Interceptor: Attach headers & cookies
    netEngine.registerRequestFilter((type, request) => {
        PlayerService._setHeaders(request, channel);
        PlayerService._appendCookieToUrl(request, type, channel);

        // Ensure Widevine license requests pass binary payload headers
        if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
            request.headers['Content-Type'] = 'application/octet-stream';
        }
    });

    // Response Interceptor: Inspect DRM server response
    netEngine.registerResponseFilter((type, response) => {
        if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
            Logger.debug('License HTTP status code:', response.status);

            // Decode payload to check for JSON or HTML error messages
            const responseText = new TextDecoder().decode(response.data);
            
            if (response.status !== 200) {
                Logger.error(`License request failed (${response.status}):`, responseText);
            } else if (Utils.isJSON(responseText)) {
                Logger.warn('License server returned JSON instead of raw binary key data:', responseText);
            }
        }
    });

    Logger.success('Network request and response filters registered');
}, 

            _setHeaders: (request, channel) => {
                request.headers['Referer'] = CONFIG.DEFAULT_REFERER;
                request.headers['User-Agent'] = CONFIG.DEFAULT_USER_AGENT;
                
                if (channel.cookie) {
                    request.headers['Cookie'] = channel.cookie;
                }

                // Add custom license headers if present
                if (channel.licenseHeaders && Object.keys(channel.licenseHeaders).length > 0) {
                    Object.assign(request.headers, channel.licenseHeaders);
                }
            },

            _appendCookieToUrl: (request, type, channel) => {
                if (!channel.cookie || !request.uris[0]) return;

                const isRelevantType = 
                    type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                    type === shaka.net.NetworkingEngine.RequestType.SEGMENT;

                if (isRelevantType && !request.uris[0].includes('__hdnea__=')) {
                    const separator = request.uris[0].includes('?') ? '&' : '?';
                    request.uris[0] += separator + channel.cookie;
                }
            },

            _handleError: (error) => {
                const errorMsg = error.detail?.message || 'Unknown player error';
                const errorCode = error.detail?.code || 'N/A';
                Logger.error(`Player error (${errorCode}): ${errorMsg}`);
                alert(`Error playing channel: ${errorMsg}`);
            },

            destroy: async () => {
                try {
                    if (PlayerService.player) {
                        Logger.log('Destroying player instance');
                        await PlayerService.player.destroy();
                        PlayerService.player = null;
                    }
                    if (PlayerService.ui) {
                        PlayerService.ui.destroy();
                        PlayerService.ui = null;
                    }
                    Logger.success('Player destroyed');
                } catch (error) {
                    Logger.error(`Error destroying player: ${error.message}`);
                }
            }
        };

        /**
         * Main Application Module
         */
        const IPTVApp = {
            state: {
                allChannels: [],
                filteredChannels: []
            },

            init: async () => {
                Logger.log('Initializing IPTV Application');
                UIService.showLoading();

                try {
                    const m3uContent = await M3UParser.fetch(CONFIG.M3U_URL);
                    IPTVApp.state.allChannels = M3UParser.parse(m3uContent);
                    IPTVApp.state.filteredChannels = [...IPTVApp.state.allChannels];

                    UIService.renderChannels(IPTVApp.state.filteredChannels);
                    IPTVApp._attachEventListeners();

                    Logger.success(`Loaded ${IPTVApp.state.allChannels.length} channels successfully!`);
                } catch (error) {
                    Logger.error(`Failed to initialize: ${error.message}`);
                    UIService.showError(error.message);
                }
            },

            _attachEventListeners: () => {
                const searchInput = Utils.getElement('search-input');
                const searchButton = Utils.getElement('search-button');
                const backButton = Utils.getElement('back-button');
                const channelGrid = Utils.getElement('channels-grid');

                if (searchInput) {
                    searchInput.addEventListener('input', IPTVApp._handleSearch);
                }

                if (searchButton) {
                    searchButton.addEventListener('click', () => searchInput?.focus());
                }

                if (backButton) {
                    backButton.addEventListener('click', IPTVApp.closePlayer);
                }

                if (channelGrid) {
                    channelGrid.addEventListener('click', IPTVApp._handleChannelClick);
                }
            },

            _handleSearch: Utils.debounce((e) => {
                const query = e.target.value.toLowerCase().trim();

                IPTVApp.state.filteredChannels = query === ''
                    ? [...IPTVApp.state.allChannels]
                    : IPTVApp.state.allChannels.filter(channel => 
                        channel.name.toLowerCase().includes(query) ||
                        channel.group.toLowerCase().includes(query)
                      );

                UIService.renderChannels(IPTVApp.state.filteredChannels);
                Logger.log(`Search filtered to ${IPTVApp.state.filteredChannels.length} results`);
            }, CONFIG.SEARCH_DEBOUNCE_MS),

            _handleChannelClick: (e) => {
                const card = e.target.closest('.channel-card');
                if (!card) return;

                const index = parseInt(card.getAttribute('data-channel-index'), 10);
                if (!isNaN(index)) {
                    IPTVApp.playChannel(index);
                }
            },

            playChannel: async (index) => {
                const channel = IPTVApp.state.filteredChannels[index];

                if (!channel) {
                    Logger.error(`Channel at index ${index} not found`);
                    return;
                }

                if (!channel.streamUrl) {
                    Logger.error('Stream URL not available for this channel');
                    alert('Stream URL not available for this channel');
                    return;
                }

                IPTVApp._logChannelInfo(channel);
                UIService.showPlayer(channel.name);

                try {
                    await PlayerService.init(channel);
                } catch (error) {
                    Logger.error(`Failed to play channel: ${error.message}`);
                    UIService.hidePlayer();
                    alert(`Failed to play channel: ${error.message}`);
                }
            },

            _logChannelInfo: (channel) => {
                Logger.log('═══════════════════════════════════');
                Logger.log(`Playing Channel: ${channel.name}`);
                Logger.log(`Group: ${channel.group}`);
                Logger.log(`Stream URL: ${channel.streamUrl}`);
                
                const drmType = DRMService.detectDRMType(channel);
                Logger.log(`DRM Type: ${drmType.toUpperCase()}`);
                
                if (drmType === 'widevine') {
                    Logger.log(`Widevine License URL: ${channel.widevineLicenseUrl}`);
                } else if (drmType === 'clearkey') {
                    Logger.log(`ClearKey License: ${channel.clearkey || channel.licenseKey}`);
                    const parsed = DRMService.parseClearKeyLicense(channel.clearkey || channel.licenseKey);
                    if (parsed) {
                        Logger.log(`ClearKey Format: ${parsed.format}`);
                        Logger.debug(`Parsed KIDs:`, Object.keys(parsed.keys));
                    }
                }
                
                Logger.log(`Cookie: ${channel.cookie ? 'Present ✓' : 'Not present ✗'}`);
                Logger.log('═══════════════════════════════════');
            },

            closePlayer: async () => {
                Logger.log('Closing player...');
                await PlayerService.destroy();
                UIService.hidePlayer();
                Logger.success('Player closed');
            }
        };

        /**
         * Initialize app on DOM ready
         */
        window.addEventListener('DOMContentLoaded', () => {
            shaka.polyfill.installAll();
            IPTVApp.init();
        });
    </script>
</body>
