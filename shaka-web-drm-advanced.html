<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My IPTV Player</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/shaka-player/dist/controls.min.css">
    <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Material+Icons+Sharp">
    <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Material+Icons+Round">
    <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141b2d;
            --bg-tertiary: #1a2332;
            --bg-card: #1e2738;
            --text-primary: #e8eaf0;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-red: #dc2626;
            --accent-green: #22c55e;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-secondary: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --gradient-overlay: linear-gradient(180deg, rgba(10, 14, 26, 0) 0%, rgba(10, 14, 26, 0.95) 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 70%);
            animation: gradientShift 20s ease infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 5%) rotate(90deg); }
            50% { transform: translate(0, 10%) rotate(180deg); }
            75% { transform: translate(-5%, 5%) rotate(270deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            margin-bottom: 32px;
            animation: fadeInDown 0.6s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .search-container {
            position: relative;
            margin-bottom: 32px;
            animation: fadeInDown 0.6s ease 0.1s both;
        }

        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 56px 16px 24px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-button:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .search-button:active {
            transform: translateY(-50%) scale(0.98);
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        .channel-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .channel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .channel-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: var(--shadow-lg), 0 0 24px rgba(59, 130, 246, 0.2);
        }

        .channel-card:hover::before {
            transform: scaleX(1);
        }

        .channel-logo-wrapper {
            width: 100%;
            height: 140px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            overflow: hidden;
            position: relative;
        }

        .channel-logo-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-overlay);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .channel-card:hover .channel-logo-wrapper::after {
            opacity: 0.3;
        }

        .channel-logo {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .channel-logo-placeholder {
            font-size: 3rem;
            color: var(--text-secondary);
        }

        .channel-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .channel-group {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .channel-group-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--accent-blue);
        }

        .drm-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 6px;
            font-size: 0.7rem;
            color: var(--accent-purple);
            margin-top: 8px;
        }

        .drm-badge.widevine {
            background: rgba(220, 38, 38, 0.15);
            border-color: rgba(220, 38, 38, 0.3);
            color: var(--accent-red);
        }

        .drm-badge.clearkey {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.3);
            color: var(--accent-green);
        }

        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-results h3 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }

        .player-container.active {
            display: flex;
            flex-direction: column;
        }

        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-button {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .back-button:active {
            transform: scale(0.95);
        }

        .player-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
        }

        #video-container {
            width: 100%;
            height: 100%;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            background: #000;
        }

        video::-webkit-media-controls {
            display: none !important;
        }
        
        video::-webkit-media-controls-enclosure {
            display: none !important;
        }
        
        video::-webkit-media-controls-panel {
            display: none !important;
        }
        
        video::-moz-media-controls {
            display: none !important;
        }
        
        #video {
            pointer-events: auto;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .channel-card {
                padding: 16px;
            }

            .channel-logo-wrapper {
                height: 100px;
            }

            .channel-name {
                font-size: 1rem;
            }
            
            video {
                object-fit: contain;
            }
        }

        @media (max-width: 480px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
        }

        .error-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .error-state h3 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .error-details {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 12px;
            font-family: 'Courier New', monospace;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-red);
        }

        .retry-button {
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .retry-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            border: 2px solid var(--border-color);
        }

        .modal-close {
            float: right;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-close:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div class="header">
            <h1>LIVE TV</h1>
            <p>Browse and watch your favorite channels</p>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    class="search-input" 
                    id="search-input" 
                    placeholder="Search channels..."
                    autocomplete="off"
                >
                <button class="search-button" id="search-button">
                    <span class="material-icons-round">search</span>
                </button>
            </div>
        </div>

        <div class="channels-grid" id="channels-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p style="color: var(--text-secondary);">Loading channels...</p>
            </div>
        </div>
    </div>

    <div class="player-container" id="player-container">
        <div class="player-header">
            <button class="back-button" id="back-button">
                <span class="material-icons-round">arrow_back</span>
            </button>
            <div class="player-title" id="player-title">Channel Name</div>
        </div>
        <div id="video-container" data-shaka-player-container>
            <video 
                id="video" 
                data-shaka-player 
                autoplay
                playsinline
                preload="metadata"
            ></video>
        </div>
    </div>

    <div class="modal-overlay" id="error-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="document.getElementById('error-modal').classList.remove('active')">&times;</span>
            <h3 style="color: var(--accent-red); margin-bottom: 16px;">⚠️ Error Details</h3>
            <div id="error-details-content"></div>
        </div>
    </div>

    <script>
        // ============================================
        // IPTV PLAYER - WIDEVINE + CLEARKEY DRM
        // REFACTORED: Better error handling, Error 6007 fixes
        // ============================================

        const CONFIG = {
            M3U_URL: "https://raw.githubusercontent.com/mrdnkl/webapps/refs/heads/main/_dir/playlist-dummy.m3u",
            SEARCH_DEBOUNCE_MS: 300,
            PLAYER_CONFIG: {
                streaming: {
                    lowLatencyMode: false,
                    bufferingGoal: 8,
                    rebufferingGoal: 2,
                    bufferBehind: 20,
                    retryParameters: { 
                        timeout: 20000,
                        maxAttempts: 5,
                        baseDelay: 500,
                        backoffFactor: 1.5
                    },
                    segmentRequestTimeout: 15000,
                    segmentPrefetchLimit: 2
                },
                manifest: { 
                    retryParameters: { 
                        timeout: 20000,
                        maxAttempts: 5
                    },
                    disableAudio: false,
                    disableVideo: false,
                    disableText: false
                },
                drm: {
                    retryParameters: {
                        timeout: 20000,
                        maxAttempts: 3,
                        baseDelay: 500,
                        backoffFactor: 1.5
                    }
                }
            },
            UI_CONFIG: {
                'controlPanelElements': [
                    'play_pause',
                    'time_and_duration',
                    'spacer',
                    'mute',
                    'volume',
                    'fullscreen',
                    'overflow_menu'
                ],
                'overflowMenuButtons': [
                    'captions',
                    'quality',
                    'language',
                    'picture_in_picture',
                    'playback_rate'
                ],
                'volumeBarColors': {
                    'base': 'rgba(63, 187, 1, 1)',
                    'level': 'rgb(255, 69, 0)'
                },
                'seekBarColors': {
                    'base': 'rgb(41, 41, 163)',
                    'buffered': 'rgb(35, 99, 3)',
                    'played': 'rgba(63, 187, 1, 1)'
                }
            },
            DEFAULT_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
            DEFAULT_REFERER: "https://www.antik.sk/"
        };

        // ============================================
        // LOGGER SERVICE
        // ============================================
        const Logger = {
            log: (msg, ...args) => console.log(`[IPTV] ${msg}`, ...args),
            warn: (msg, ...args) => console.warn(`[IPTV] ⚠️ ${msg}`, ...args),
            error: (msg, ...args) => console.error(`[IPTV] ❌ ${msg}`, ...args),
            success: (msg, ...args) => console.log(`[IPTV] ✅ ${msg}`, ...args),
            debug: (msg, ...args) => console.debug(`[IPTV] 🔍 ${msg}`, ...args)
        };

        // ============================================
        // UTILITY SERVICE
        // ============================================
        const Utils = {
            debounce: (func, delay) => {
                let timeoutId;
                return (...args) => {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => func(...args), delay);
                };
            },

            getElement: (id) => {
                const element = document.getElementById(id);
                if (!element) {
                    Logger.error(`Element with ID '${id}' not found`);
                }
                return element;
            },

            isValidUrl: (url) => {
                try {
                    new URL(url);
                    return true;
                } catch {
                    return false;
                }
            },

            isJSON: (str) => {
                try {
                    JSON.parse(str);
                    return true;
                } catch {
                    return false;
                }
            },

            parseJSON: (str, fallback = null) => {
                try {
                    return JSON.parse(str);
                } catch (error) {
                    Logger.warn(`Failed to parse JSON: ${error.message}`);
                    return fallback;
                }
            },

            sleep: (ms) => new Promise(resolve => setTimeout(resolve, ms))
        };

        // ============================================
        // DRM SERVICE - FIXED ERROR 6007
        // ============================================
        const DRMService = {
            detectDRMType: (channel) => {
                if (channel.widevineLicenseUrl) {
                    return 'widevine';
                }
                if (channel.clearkey || channel.licenseKey) {
                    return 'clearkey';
                }
                return 'none';
            },

            parseClearKeyLicense: (licenseData) => {
                if (!licenseData) return null;

                Logger.debug('Parsing ClearKey license');

                // Try JSON JWK format first
                if (Utils.isJSON(licenseData)) {
                    try {
                        const jwk = Utils.parseJSON(licenseData);
                        
                        if (jwk.keys && Array.isArray(jwk.keys)) {
                            const keys = {};
                            jwk.keys.forEach(key => {
                                if (key.k && key.kid) {
                                    keys[key.kid] = key.k;
                                }
                            });
                            
                            if (Object.keys(keys).length > 0) {
                                Logger.success('ClearKey parsed from JWK format');
                                return { format: 'jwk', keys };
                            }
                        }
                    } catch (error) {
                        Logger.warn(`Failed to parse JWK format: ${error.message}`);
                    }
                }

                // Try simple kid:key format
                if (typeof licenseData === 'string' && licenseData.includes(':')) {
                    try {
                        const parts = licenseData.split(':');
                        if (parts.length === 2 && parts[0] && parts[1]) {
                            Logger.success('ClearKey parsed from kid:key format');
                            return {
                                format: 'simple',
                                keys: { [parts[0]]: parts[1] }
                            };
                        }
                    } catch (error) {
                        Logger.warn(`Failed to parse simple format: ${error.message}`);
                    }
                }

                Logger.error('Unable to parse ClearKey license');
                return null;
            },

            configureDRM: (player, channel) => {
                const drmType = DRMService.detectDRMType(channel);
                
                if (drmType === 'none') {
                    Logger.log('No DRM protection detected');
                    return;
                }

                Logger.log(`Configuring ${drmType.toUpperCase()} DRM`);

                try {
                    if (drmType === 'widevine') {
                        DRMService._configureWidevine(player, channel);
                    } else if (drmType === 'clearkey') {
                        DRMService._configureClearkey(player, channel);
                    }
                } catch (error) {
                    Logger.error(`Failed to configure ${drmType}: ${error.message}`);
                    throw error;
                }
            },

            /**
             * Widevine configuration - FIXED for Error 6007 & 6012
             * Error 6007: License request failed
             * Error 6012: DRM system error
             */
            _configureWidevine: (player, channel) => {
                if (!channel.widevineLicenseUrl) {
                    throw new Error('Widevine license server URL required');
                }

                Logger.debug('Configuring Widevine DRM');

                try {
                    // Configure DRM settings with proper robustness
                    const config = {
                        drm: {
                            servers: {
                                'com.widevine.alpha': channel.widevineLicenseUrl
                            },
                            advanced: {
                                'com.widevine.alpha': {
                                    'videoRobustness': 'SW_SECURE_DECODE',
                                    'audioRobustness': 'SW_SECURE_DECODE'
                                    // Don't set serverCertificate - let it auto-detect
                                }
                            }
                        }
                    };

                    player.configure(config);
                    Logger.debug(`License Server: ${channel.widevineLicenseUrl}`);

                    // Register request filter for license requests (FIX for Error 6007)
                    player.getNetworkingEngine().registerRequestFilter((type, request) => {
                        if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
                            // CRITICAL: These headers are essential for license servers
                            request.headers['Content-Type'] = 'application/octet-stream';
                            request.headers['User-Agent'] = CONFIG.DEFAULT_USER_AGENT;
                            request.headers['Referer'] = CONFIG.DEFAULT_REFERER;
                            request.method = 'POST';

                            // Add custom headers from channel config
                            if (channel.licenseHeaders && typeof channel.licenseHeaders === 'object') {
                                Object.entries(channel.licenseHeaders).forEach(([key, value]) => {
                                    request.headers[key] = value;
                                    Logger.debug(`Added header: ${key}`);
                                });
                            }

                            Logger.debug('License request prepared');
                        }
                    });

                    // Register response filter to validate license
                    player.getNetworkingEngine().registerResponseFilter((type, response) => {
                        if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
                            Logger.debug(`LICENSE response: ${response.data.byteLength} bytes, Status: ${response.status}`);
                            
                            // Validate response (FIX for Error 6007)
                            if (!response.data || response.data.byteLength === 0) {
                                throw new Error('Empty license response from server - may indicate server error or invalid license');
                            }

                            if (response.status && response.status >= 400) {
                                throw new Error(`License server error: HTTP ${response.status}`);
                            }
                        }
                    });

                    Logger.success('Widevine DRM configured');
                } catch (error) {
                    Logger.error(`Widevine config failed: ${error.message}`);
                    throw error;
                }
            },

            /**
             * ClearKey configuration
             */
            _configureClearkey: (player, channel) => {
                const clearKeyData = channel.clearkey || channel.licenseKey;
                
                if (!clearKeyData) {
                    throw new Error('ClearKey data not available');
                }

                const parsedLicense = DRMService.parseClearKeyLicense(clearKeyData);
                
                if (!parsedLicense || !parsedLicense.keys || Object.keys(parsedLicense.keys).length === 0) {
                    throw new Error('Invalid ClearKey license format or no keys found');
                }

                try {
                    const config = {
                        drm: {
                            clearKeys: parsedLicense.keys
                        }
                    };

                    player.configure(config);
                    Logger.success(`ClearKey configured with ${Object.keys(parsedLicense.keys).length} key(s)`);
                    Logger.debug('ClearKey KIDs:', Object.keys(parsedLicense.keys));
                } catch (error) {
                    Logger.error(`ClearKey config failed: ${error.message}`);
                    throw error;
                }
            }
        };

        // ============================================
        // M3U PARSER SERVICE
        // ============================================
        const M3UParser = {
            fetch: async (url) => {
                if (!Utils.isValidUrl(url)) {
                    throw new Error(`Invalid M3U URL: ${url}`);
                }

                Logger.log(`Fetching M3U from: ${url}`);
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    const text = await response.text();
                    Logger.log(`M3U fetched: ${text.length} bytes`);
                    return text;
                } catch (error) {
                    Logger.error(`Failed to fetch M3U: ${error.message}`);
                    throw error;
                }
            },

            parse: (m3uContent) => {
                if (!m3uContent || typeof m3uContent !== 'string') {
                    Logger.error('Invalid M3U content');
                    return [];
                }

                const channels = [];
                const lines = m3uContent.split('\n').map(l => l.trim()).filter(l => l);

                let currentChannel = {};
                let widevineLicenseUrl = '';
                let clearkey = '';
                let licenseHeaders = {};

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    if (line.startsWith('#EXTINF:')) {
                        currentChannel = M3UParser._parseExtinf(line);
                    }
                    else if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
                        widevineLicenseUrl = line.replace('#KODIPROP:inputstream.adaptive.license_key=', '');
                    }
                    else if (line.startsWith('#KODIPROP:inputstream.clearkey') || line.startsWith('#EXT-X-CLEARKEY=')) {
                        clearkey = line.replace('#KODIPROP:inputstream.clearkey.license_key=', '')
                                       .replace('#EXT-X-CLEARKEY=', '');
                    }
                    else if (line.startsWith('#KODIPROP:inputstream.adaptive.license_headers=')) {
                        const headerStr = line.replace('#KODIPROP:inputstream.adaptive.license_headers=', '');
                        licenseHeaders = Utils.parseJSON(headerStr, {});
                    }
                    else if (line.startsWith('http')) {
                        const channel = {
                            ...currentChannel,
                            streamUrl: line,
                            widevineLicenseUrl: widevineLicenseUrl,
                            clearkey: clearkey,
                            licenseKey: widevineLicenseUrl || clearkey,
                            licenseHeaders: licenseHeaders
                        };
                        if (channel.streamUrl) {
                            channels.push(channel);
                        }
                        currentChannel = {};
                        widevineLicenseUrl = '';
                        clearkey = '';
                        licenseHeaders = {};
                    }
                }

                Logger.success(`Parsed ${channels.length} channels`);
                return channels;
            },

            _parseExtinf: (line) => {
                const nameMatch = line.match(/,(.+)$/);
                const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                const groupMatch = line.match(/group-title="([^"]+)"/);
                const idMatch = line.match(/tvg-id="([^"]+)"/);

                return {
                    name: nameMatch ? nameMatch[1].trim() : 'Unknown',
                    logo: logoMatch ? logoMatch[1] : '',
                    group: groupMatch ? groupMatch[1] : 'General',
                    id: idMatch ? idMatch[1] : `ch_${Date.now()}`
                };
            }
        };

        // ============================================
        // UI SERVICE
        // ============================================
        const UIService = {
            showLoading: () => {
                const grid = Utils.getElement('channels-grid');
                if (grid) {
                    grid.innerHTML = `
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p style="color: var(--text-secondary);">Loading channels...</p>
                        </div>
                    `;
                }
            },

            showError: (message = 'Could not fetch playlist', errorCode = null) => {
                const grid = Utils.getElement('channels-grid');
                if (grid) {
                    const errorMsg = errorCode ? `(Error ${errorCode})` : '';
                    grid.innerHTML = `
                        <div class="error-state">
                            <div class="error-icon">⚠️</div>
                            <h3>Failed to load channels</h3>
                            <p>${message} ${errorMsg}</p>
                            <button class="retry-button" onclick="IPTVApp.init()">Retry</button>
                        </div>
                    `;
                }
            },

            showNoResults: () => {
                const grid = Utils.getElement('channels-grid');
                if (grid) {
                    grid.innerHTML = `
                        <div class="no-results">
                            <div class="no-results-icon">🔍</div>
                            <h3>No channels found</h3>
                            <p>Try a different search</p>
                        </div>
                    `;
                }
            },

            renderChannels: (channels) => {
                const grid = Utils.getElement('channels-grid');
                if (!grid) return;

                if (channels.length === 0) {
                    UIService.showNoResults();
                    return;
                }

                grid.innerHTML = channels.map((channel, index) => {
                    const drmType = DRMService.detectDRMType(channel);
                    const drmBadge = drmType !== 'none' 
                        ? `<span class="drm-badge ${drmType}">${drmType.toUpperCase()}</span>`
                        : '';

                    return `
                        <div class="channel-card" data-channel-index="${index}">
                            <div class="channel-logo-wrapper">
                                ${channel.logo 
                                    ? `<img src="${channel.logo}" alt="${channel.name}" class="channel-logo" onerror="this.style.display='none'">`
                                    : `<span class="channel-logo-placeholder">📺</span>`
                                }
                            </div>
                            <div class="channel-name">${channel.name}</div>
                            <div class="channel-group">
                                <span class="channel-group-badge">
                                    <span class="material-icons-round" style="font-size: 0.875rem;">category</span>
                                    ${channel.group}
                                </span>
                            </div>
                            ${drmBadge}
                        </div>
                    `;
                }).join('');

                // Add event listeners
                grid.querySelectorAll('.channel-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const index = parseInt(card.getAttribute('data-channel-index'), 10);
                        if (!isNaN(index)) {
                            IPTVApp.playChannel(index);
                        }
                    });
                });
            },

            showPlayer: (channelName) => {
                const playerContainer = Utils.getElement('player-container');
                const playerTitle = Utils.getElement('player-title');
                if (playerContainer && playerTitle) {
                    playerTitle.textContent = channelName;
                    playerContainer.classList.add('active');
                }
            },

            hidePlayer: () => {
                const playerContainer = Utils.getElement('player-container');
                if (playerContainer) {
                    playerContainer.classList.remove('active');
                }
            },

            showErrorModal: (title, message, errorCode = null) => {
                const modal = Utils.getElement('error-modal');
                const content = Utils.getElement('error-details-content');
                
                if (modal && content) {
                    const codeInfo = errorCode ? `<p><strong>Error Code:</strong> ${errorCode}</p>` : '';
                    content.innerHTML = `
                        <p><strong>Message:</strong> ${message}</p>
                        ${codeInfo}
                        <p style="margin-top: 12px; font-size: 0.875rem;">
                            <strong>Troubleshooting:</strong><br>
                            1. Check license server URL<br>
                            2. Verify network connection<br>
                            3. Check browser console for details<br>
                            4. Try a different channel
                        </p>
                    `;
                    modal.classList.add('active');
                }
            }
        };

        // ============================================
        // PLAYER SERVICE
        // ============================================
        const PlayerService = {
            player: null,
            ui: null,
            currentChannel: null,

            init: async (channel) => {
                const video = Utils.getElement('video');
                const videoContainer = Utils.getElement('video-container');

                if (!video || !videoContainer) {
                    throw new Error('Video elements not found');
                }

                Logger.log('Initializing Shaka Player');

                try {
                    await PlayerService.destroy();

                    if (!shaka.Player.isBrowserSupported()) {
                        throw new Error('Browser not supported by Shaka Player');
                    }

                    PlayerService.player = new shaka.Player();
                    await PlayerService.player.attach(video);
                    Logger.success('Player attached');

                    PlayerService.ui = new shaka.ui.Overlay(PlayerService.player, videoContainer, video);
                    PlayerService.ui.configure(CONFIG.UI_CONFIG);

                    // Configure streaming BEFORE DRM
                    PlayerService.player.configure(CONFIG.PLAYER_CONFIG);

                    // Add error handler
                    PlayerService.player.addEventListener('error', PlayerService._handleError);

                    // Configure DRM
                    DRMService.configureDRM(PlayerService.player, channel);
                    PlayerService.currentChannel = channel;

                    Logger.log('Loading stream...');
                    await PlayerService.player.load(channel.streamUrl);
                    Logger.success('Stream loaded!');
                } catch (error) {
                    Logger.error(`Init failed: ${error.message}`);
                    throw error;
                }
            },

            _handleError: (error) => {
                const errorDetail = error.detail;
                const errorMsg = errorDetail?.message || 'Unknown error';
                const errorCode = errorDetail?.code || 'N/A';
                
                Logger.error(`Player error (${errorCode}): ${errorMsg}`);

                // Specific error handling for common DRM issues
                const errorHandling = {
                    6007: {
                        title: 'License Request Failed (Error 6007)',
                        message: 'Unable to fetch DRM license. This usually means:\n• License server is unreachable\n• Invalid license server URL\n• Server returned an error\n• Missing required headers'
                    },
                    6012: {
                        title: 'DRM System Error (Error 6012)',
                        message: 'DRM system error. Possible causes:\n• Browser DRM support missing\n• Invalid robustness settings\n• Incompatible video codec'
                    },
                    4010: {
                        title: 'Manifest Loading Error (4010)',
                        message: 'Failed to load stream manifest. Check URL validity.'
                    }
                };

                const errorInfo = errorHandling[errorCode] || {
                    title: `Playback Error (${errorCode})`,
                    message: errorMsg
                };

                UIService.showErrorModal(errorInfo.title, errorInfo.message, errorCode);
            },

            destroy: async () => {
                try {
                    if (PlayerService.player) {
                        await PlayerService.player.destroy();
                        PlayerService.player = null;
                    }
                    if (PlayerService.ui) {
                        PlayerService.ui.destroy();
                        PlayerService.ui = null;
                    }
                    PlayerService.currentChannel = null;
                    Logger.success('Player destroyed');
                } catch (error) {
                    Logger.warn(`Player destroy error: ${error.message}`);
                }
            }
        };

        // ============================================
        // MAIN APP
        // ============================================
        const IPTVApp = {
            state: {
                allChannels: [],
                filteredChannels: [],
                searchQuery: ''
            },

            async init() {
                try {
                    UIService.showLoading();
                    Logger.log('Initializing IPTV App');

                    // Fetch and parse M3U
                    const m3uContent = await M3UParser.fetch(CONFIG.M3U_URL);
                    IPTVApp.state.allChannels = M3UParser.parse(m3uContent);

                    if (IPTVApp.state.allChannels.length === 0) {
                        throw new Error('No channels found in playlist');
                    }

                    IPTVApp.state.filteredChannels = IPTVApp.state.allChannels;
                    UIService.renderChannels(IPTVApp.state.filteredChannels);
                    IPTVApp._attachEventListeners();
                    Logger.success('App initialized successfully');
                } catch (error) {
                    Logger.error(`App init failed: ${error.message}`);
                    UIService.showError(error.message);
                }
            },

            _attachEventListeners: () => {
                const searchInput = Utils.getElement('search-input');
                const searchButton = Utils.getElement('search-button');
                const backButton = Utils.getElement('back-button');

                if (searchInput) {
                    const debouncedSearch = Utils.debounce(() => {
                        IPTVApp.state.searchQuery = searchInput.value.toLowerCase();
                        IPTVApp._filterChannels();
                    }, CONFIG.SEARCH_DEBOUNCE_MS);

                    searchInput.addEventListener('input', debouncedSearch);
                    searchInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            IPTVApp.state.searchQuery = searchInput.value.toLowerCase();
                            IPTVApp._filterChannels();
                        }
                    });
                }

                if (searchButton) {
                    searchButton.addEventListener('click', () => {
                        IPTVApp.state.searchQuery = searchInput.value.toLowerCase();
                        IPTVApp._filterChannels();
                    });
                }

                if (backButton) {
                    backButton.addEventListener('click', () => {
                        IPTVApp.closePlayer();
                    });
                }
            },

            _filterChannels: () => {
                const query = IPTVApp.state.searchQuery;

                if (!query) {
                    IPTVApp.state.filteredChannels = IPTVApp.state.allChannels;
                } else {
                    IPTVApp.state.filteredChannels = IPTVApp.state.allChannels.filter(channel =>
                        channel.name.toLowerCase().includes(query) ||
                        channel.group.toLowerCase().includes(query)
                    );
                }

                UIService.renderChannels(IPTVApp.state.filteredChannels);
            },

            playChannel: async (index) => {
                const channel = IPTVApp.state.filteredChannels[index];

                if (!channel || !channel.streamUrl) {
                    UIService.showErrorModal('Invalid Channel', 'Stream URL not available for this channel');
                    return;
                }

                Logger.log(`Playing: ${channel.name}`);
                UIService.showPlayer(channel.name);

                try {
                    await PlayerService.init(channel);
                } catch (error) {
                    UIService.hidePlayer();
                    UIService.showErrorModal('Playback Failed', error.message);
                }
            },

            closePlayer: async () => {
                await PlayerService.destroy();
                UIService.hidePlayer();
            }
        };

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            if (!window.shaka) {
                Logger.error('Shaka Player not loaded');
                UIService.showError('Shaka Player library failed to load');
                return;
            }

            shaka.polyfill.installAll();
            IPTVApp.init();
        });
    </script>
    <script type="text/javascript" src="//cdn.jsdelivr.net/npm/shaka-player@4.3.6/dist/shaka-player.compiled.js"></script>
    <script type="text/javascript" src="//cdn.jsdelivr.net/npm/shaka-player/dist/shaka-player.ui.min.js" crossorigin="anonymous"></script>
</body>
